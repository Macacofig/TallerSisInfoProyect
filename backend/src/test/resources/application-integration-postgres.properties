# Perfil exclusivo HU-17. Las claves en mayúsculas son las leídas directamente
# por DatabaseConfiguration; Spring datasource.* no sustituye estos valores.
SUPABASE_DATASOURCE_URL=jdbc:postgresql://127.0.0.1:55433/hu17_verify
SUPABASE_USER=hu17_verify
SUPABASE_PASSWORD=${HU17_VERIFY_PASSWORD}

SPRING_DATASOURCE_URL=jdbc:postgresql://127.0.0.1:55433/hu17_verify
POSTGRES_USER=hu17_verify
POSTGRES_PASSWORD=${HU17_VERIFY_PASSWORD}

# Crea el esquema desde las entidades al iniciar y lo elimina al terminar.
spring.jpa.hibernate.ddl-auto=create-drop
