spring.application.name=backend

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

logging.level.com.unihub.backend=${LOG_LEVEL:INFO}
logging.level.org.hibernate.SQL=${HIBERNATE_SQL_LOG_LEVEL:OFF}
logging.level.org.springframework.web.servlet.mvc.support.DefaultHandlerExceptionResolver=ERROR

server.port=${PORT:${BACKEND_PORT:8081}}
server.ssl.enabled=${SERVER_SSL_ENABLED:false}
server.ssl.key-store=${SERVER_SSL_KEY_STORE:/run/tls/server.p12}
server.ssl.key-store-password=${SERVER_SSL_KEY_STORE_PASSWORD:}
server.ssl.key-store-type=${SERVER_SSL_KEY_STORE_TYPE:PKCS12}
server.ssl.key-alias=${SERVER_SSL_KEY_ALIAS:}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:3600}
app.security.catalog-admin-token=${CATALOG_ADMIN_TOKEN:}
app.security.jwt-middleware.enabled=true

# Supabase Storage para los materiales académicos (HU-35)
app.supabase.url=${SUPABASE_URL:}
app.supabase.service-role-key=${SUPABASE_SERVICE_ROLE_KEY:}
app.supabase.storage.bucket=${SUPABASE_STORAGE_BUCKET:MaterialsTaller}
spring.servlet.multipart.max-file-size=${MATERIALES_MAX_FILE_SIZE:20MB}
spring.servlet.multipart.max-request-size=${MATERIALES_MAX_REQUEST_SIZE:25MB}
app.materiales.max-file-size-bytes=${MATERIALES_MAX_FILE_SIZE_BYTES:20971520}
