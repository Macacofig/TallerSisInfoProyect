<section class="perfil">

  <div class="perfil__container">

    <div class="perfil__header">

      <div class="perfil__avatar">
        {{ usuario?.nombre?.charAt(0)?.toUpperCase() }}
      </div>

      <div>
        <h1>{{ MESSAGES.PAGE_TITLE }}</h1>
        <p>{{ MESSAGES.PAGE_SUBTITLE }}</p>
      </div>

    </div>

    <form class="perfil__card" [formGroup]="formulario">

      <div class="perfil__field">

        <label for="nombre">
          {{ MESSAGES.NAME_LABEL }}
        </label>

        <input
          id="nombre"
          type="text"
          formControlName="nombre"
        />

      </div>

      <div class="perfil__field">

        <label for="telefono">
          {{ MESSAGES.PHONE_LABEL }}
        </label>

        <input
          id="telefono"
          type="tel"
          formControlName="telefono"
        />

      </div>

      <div class="perfil__field">

        <label for="carrera">
          {{ MESSAGES.CAREER_LABEL }}
        </label>

        <input
          id="carrera"
          type="text"
          formControlName="carrera"
        />

      </div>

      <div class="perfil__actions">

        <button
          type="button"
          class="perfil__save-button"
          (click)="guardarCambios()"
        >
          {{ MESSAGES.SAVE_BUTTON }}
        </button>

      </div>

    </form>

  </div>

</section>

@if (modalVisible()) {

  <div class="perfil-modal__overlay">

    <div class="perfil-modal">

      <div
        class="perfil-modal__icon"
        [class.perfil-modal__icon--error]="!modalExito()"
      >
        {{ modalExito() ? '✓' : '!' }}
      </div>

      <h2>
        {{
          modalExito()
            ? MESSAGES.SUCCESS_TITLE
            : MESSAGES.ERROR_TITLE
        }}
      </h2>

      <p>
        {{ modalMensaje() }}
      </p>

      <button
        type="button"
        class="perfil-modal__button"
        (click)="cerrarModal()"
      >
        {{ MESSAGES.ACCEPT_BUTTON }}
      </button>

    </div>

  </div>

}
