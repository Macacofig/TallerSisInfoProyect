<div class="splash">

  <div class="background-decoration">
    <span class="node node-1"></span>
    <span class="node node-2"></span>
    <span class="node node-3"></span>
    <span class="node node-4"></span>

    <span class="line line-1"></span>
    <span class="line line-2"></span>
    <span class="line line-3"></span>
  </div>

  <div class="logo-container">

    <div class="logo-icon">
      U
    </div>

    <h1>{{ MESSAGES.APP_NAME }}</h1>

    <p>{{ MESSAGES.TAGLINE }}</p>

    <div
      class="progress-track"
      role="progressbar"
      [attr.aria-label]="MESSAGES.PROGRESS_LABEL"
      [attr.aria-valuenow]="progress()"
      aria-valuemin="0"
      aria-valuemax="100">
      <div class="progress-fill" [style.width.%]="progress()"></div>
    </div>

    <p class="status-message" aria-live="polite">
      @if (failedService() === 'backend') {
        {{ MESSAGES.BACKEND_ERROR }}
      } @else if (failedService() === 'database') {
        {{ MESSAGES.DATABASE_ERROR }}
      } @else {
        {{ MESSAGES[stage()] }}
      }
    </p>

    @if (failedService()) {
      <button class="retry-button" type="button" (click)="retryConnection()">
        {{ MESSAGES.RETRY }}
      </button>
    }

  </div>

</div>
