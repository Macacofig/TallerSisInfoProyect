<aside class="sidebar">

  <header class="sidebar__header">
    <div class="sidebar__brand">

      <div class="sidebar__logo">
        <span class="sidebar__logo-mark">▥</span>
      </div>

      <div class="sidebar__brand-text">
        <span class="sidebar__brand-name">
          {{ SIDEBAR_MESSAGES.BRAND_NAME }}
        </span>

        <span class="sidebar__brand-subtitle">
          {{ SIDEBAR_MESSAGES.BRAND_SUBTITLE }}
        </span>
      </div>

    </div>
  </header>


  <nav
    class="sidebar__navigation"
    [attr.aria-label]="SIDEBAR_MESSAGES.NAVIGATION_LABEL"
  >

    <a
      routerLink="/home"
      routerLinkActive="sidebar__item--active"
      [routerLinkActiveOptions]="{ exact: true }"
      class="sidebar__item"
    >

      <span
        class="sidebar__icon"
        aria-hidden="true"
      >
        <svg
          viewBox="0 0 24 24"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
        >
          <path
            d="M4 11.5L12 5L20 11.5V19C20 19.55 19.55 20 19 20H5C4.45 20 4 19.55 4 19V11.5Z"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linejoin="round"
          />
          <path
            d="M9 20V14H15V20"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linejoin="round"
          />
        </svg>
      </span>

      <span class="sidebar__label">
        {{ SIDEBAR_MESSAGES.MENU_HOME }}
      </span>

    </a>

    <a
      routerLink="/materias"
      routerLinkActive="sidebar__item--active"
      [routerLinkActiveOptions]="{ exact: true }"
      class="sidebar__item"
    >

      <span
        class="sidebar__icon"
        aria-hidden="true"
      >
        <svg
          viewBox="0 0 24 24"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
        >
          <path
            d="M4 5.5C4 4.67 4.67 4 5.5 4H18.5C19.33 4 20 4.67 20 5.5V18.5C20 19.33 19.33 20 18.5 20H5.5C4.67 20 4 19.33 4 18.5V5.5Z"
            stroke="currentColor"
            stroke-width="1.8"
          />

          <path
            d="M8 8H16M8 12H16M8 16H13"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
          />
        </svg>
      </span>

      <span class="sidebar__label">
        {{ SIDEBAR_MESSAGES.MENU_MATERIAS }}
      </span>

    </a>

  </nav>


  <footer class="sidebar__footer">
    <p>
      {{ SIDEBAR_MESSAGES.DEMO_NOTICE }}
    </p>
  </footer>

</aside>
