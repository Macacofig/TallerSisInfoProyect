<header class="navbar">
  <div class="navbar__actions">
    <button
      type="button"
      class="navbar__language-toggle"
      (click)="cambiarIdioma()"
      [attr.aria-label]="NAVBAR_MESSAGES.TOGGLE_LANGUAGE_LABEL"
    >
      {{ idiomaBoton }}
    </button>

    <button
      type="button"
      class="navbar__notification"
      [attr.aria-label]="NAVBAR_MESSAGES.NOTIFICATIONS_ARIA_LABEL"
    >
      <svg
        class="navbar__notification-icon"
        viewBox="0 0 24 24"
        fill="none"
        xmlns="http://www.w3.org/2000/svg"
        aria-hidden="true"
      >
        <path
          d="M18 9C18 5.5 15.8 3 12 3C8.2 3 6 5.5 6 9C6 14 4 15.5 4 17H20C20 15.5 18 14 18 9Z"
          stroke="currentColor"
          stroke-width="1.7"
          stroke-linecap="round"
          stroke-linejoin="round"
        />

        <path
          d="M10 20C10.4 20.6 11.1 21 12 21C12.9 21 13.6 20.6 14 20"
          stroke="currentColor"
          stroke-width="1.7"
          stroke-linecap="round"
        />
      </svg>
    </button>

    <div class="navbar__user-container">

      <button
        type="button"
        class="navbar__user"
        [attr.aria-label]="NAVBAR_MESSAGES.PROFILE_MENU"
        [attr.aria-expanded]="menuUsuarioAbierto()"
        (click)="alternarMenuUsuario()"
      >
        <span class="navbar__avatar">
          {{ obtenerIniciales() }}
        </span>

        <span class="navbar__user-info">
          <span class="navbar__user-name">
            {{ usuario()?.nombre }}
          </span>
        </span>
      </button>

      @if (menuUsuarioAbierto()) {
        <div class="navbar__user-menu">

          <button
            type="button"
            class="navbar__user-menu-item"
            (click)="irAPerfil()"
          >
            {{ NAVBAR_MESSAGES.PROFILE_MENU }}
          </button>

          <button
            type="button"
            class="navbar__user-menu-item"
            (click)="cerrarSesion()"
          >
            {{ NAVBAR_MESSAGES.LOGOUT_MENU }}
          </button>

        </div>
      }

    </div>
  </div>
</header>
