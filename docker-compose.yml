services:

  backend:
    build:
      context: ./backend
    container_name: unihub-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT}:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}?sslmode=require
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      CORS_ALLOWED_ORIGIN: ${CORS_ALLOWED_ORIGIN}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_SECONDS: ${JWT_EXPIRATION_SECONDS:-3600}
      CATALOG_ADMIN_TOKEN: ${CATALOG_ADMIN_TOKEN:-}
      PASSWORD_LEGACY_MIGRATION_ENABLED: ${PASSWORD_LEGACY_MIGRATION_ENABLED:-false}
      SERVER_SSL_ENABLED: ${SERVER_SSL_ENABLED:-false}
      SERVER_SSL_KEY_STORE: ${SERVER_SSL_KEY_STORE:-}
      SERVER_SSL_KEY_STORE_PASSWORD: ${SERVER_SSL_KEY_STORE_PASSWORD:-}
      SERVER_SSL_KEY_STORE_TYPE: ${SERVER_SSL_KEY_STORE_TYPE:-PKCS12}
      SERVER_SSL_KEY_ALIAS: ${SERVER_SSL_KEY_ALIAS:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      HIBERNATE_SQL_LOG_LEVEL: ${HIBERNATE_SQL_LOG_LEVEL:-OFF}
    volumes:
      - ./backend/logs:/app/logs
      - ${SERVER_SSL_KEY_STORE_HOST_PATH:-./certs/server.p12}:${SERVER_SSL_KEY_STORE:-/run/tls/server.p12}:ro

  frontend:
    build:
      context: ./frontend
    container_name: unihub-frontend
    restart: unless-stopped
    ports:
      - "4200:4200"
    volumes:
      - ./frontend/src:/app/src:ro
    command: ["npm", "start", "--", "--host", "0.0.0.0", "--poll", "1000"]
    depends_on:
      - backend

