services:

  backend:
    build:
      context: ./backend
    container_name: unihub-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT}:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}?sslmode=require
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      CORS_ALLOWED_ORIGIN: ${CORS_ALLOWED_ORIGIN}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      HIBERNATE_SQL_LOG_LEVEL: ${HIBERNATE_SQL_LOG_LEVEL:-OFF}
    volumes:
      - ./backend/logs:/app/logs

  frontend:
    build:
      context: ./frontend
    container_name: unihub-frontend
    restart: unless-stopped
    ports:
      - "4200:4200"
    volumes:
      - ./frontend/src:/app/src:ro
    command: ["npm", "start", "--", "--host", "0.0.0.0", "--poll", "1000"]
    depends_on:
      - backend

